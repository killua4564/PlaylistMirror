<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景：深藍黑，帶一點由上往下的漸層 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15182d"/><stop offset="1" stop-color="#090b17"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a85"/><stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4ff"/><stop offset="1" stop-color="#4d7cff"/>
    </linearGradient>
    <!-- 發光效果：把形狀模糊後疊在原形狀底下 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 中間的對稱軸（鏡子） -->
  <rect x="254" y="104" width="4" height="304" rx="2" fill="#ffffff" fill-opacity="0.28"/>
  <!-- 左半邊：四條「歌單」橫條，靠右對齊中線 -->
  <g filter="url(#glow)" fill="url(#red)">
    <rect x="64"  y="144" width="168" height="32" rx="16"/>
    <rect x="112" y="208" width="120" height="32" rx="16"/>
    <rect x="84"  y="272" width="148" height="32" rx="16"/>
    <rect x="148" y="336" width="84"  height="32" rx="16"/>
  </g>
  <!-- 右半邊：同樣的四條，左右對稱翻過去，改成藍色 -->
  <g filter="url(#glow)" fill="url(#blue)">
    <rect x="280" y="144" width="168" height="32" rx="16"/>
    <rect x="280" y="208" width="120" height="32" rx="16"/>
    <rect x="280" y="272" width="148" height="32" rx="16"/>
    <rect x="280" y="336" width="84"  height="32" rx="16"/>
  </g>
</svg>
